<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1587" height="1123" viewBox="0 0 1587 1123" font-family="Montserrat, 'Be Vietnam Pro', Arial, sans-serif">
  <defs>
    <style>
      .hd{font-size:16px;font-weight:800;fill:#ffffff;letter-spacing:.5px}
      .ln{font-size:13.5px;fill:#2a313b}
      .num{font-size:13.5px;font-weight:800;fill:#7A0C1E}
      .cap{font-size:13px;fill:#6b5a4a}
    </style>
  </defs>

  <rect width="1587" height="1123" fill="#F7F2E7"/>
  <rect x="14" y="14" width="1559" height="1095" fill="none" stroke="#8C5A3C" stroke-width="2.5"/>
  <rect x="22" y="22" width="1543" height="1079" fill="none" stroke="#F2B705" stroke-width="1.2"/>

  <text x="40" y="60" font-size="20" fill="#F2B705">★</text>
  <text x="1530" y="60" font-size="20" fill="#F2B705">★</text>

  <text x="793" y="62" text-anchor="middle" font-size="31" font-weight="800" fill="#7A0C1E">SƠ ĐỒ TƯ DUY TỔNG THỂ</text>
  <text x="793" y="92" text-anchor="middle" font-size="16.5" font-weight="800" fill="#1B2A4A">ĐỒNG CHÍ HOÀNG VĂN THỤ (1909 – 1944) &amp; TRƯỜNG THPT HOÀNG VĂN THỤ – UÔNG BÍ, QUẢNG NINH</text>
  <text x="793" y="118" text-anchor="middle" font-size="13" fill="#6b5a4a">Bài tập lớn Lịch sử • Hoạt động trải nghiệm — Khổ in A3 ngang (420 × 297 mm)</text>
  <line x1="470" y1="132" x2="1117" y2="132" stroke="#C8102E" stroke-width="3"/>

  <!-- ============ CONNECTORS ============ -->
  <g fill="none" stroke-width="4">
    <path d="M623 555 C520 555 505 245 390 245" stroke="#1B2A4A"/>
    <path d="M623 575 C515 575 505 453 390 453" stroke="#8C5A3C"/>
    <path d="M623 595 C515 595 505 661 390 661" stroke="#C8102E"/>
    <path d="M963 545 C1075 545 1080 253 1197 253" stroke="#7A0C1E"/>
