    <path d="M963 605 C1080 605 1080 715 1197 715" stroke="#1B2A4A"/>
    <path d="M793 635 L793 884" stroke="#C8102E"/>
  </g>
  <g>
    <circle cx="623" cy="555" r="5" fill="#7A0C1E"/><circle cx="623" cy="575" r="5" fill="#7A0C1E"/>
    <circle cx="623" cy="595" r="5" fill="#7A0C1E"/><circle cx="963" cy="545" r="5" fill="#7A0C1E"/>
    <circle cx="963" cy="575" r="5" fill="#7A0C1E"/><circle cx="963" cy="605" r="5" fill="#7A0C1E"/>
    <circle cx="793" cy="635" r="5" fill="#7A0C1E"/>
    <circle cx="390" cy="245" r="6" fill="#1B2A4A"/><circle cx="390" cy="453" r="6" fill="#8C5A3C"/>
    <circle cx="390" cy="661" r="6" fill="#C8102E"/><circle cx="1197" cy="253" r="6" fill="#7A0C1E"/>
    <circle cx="1197" cy="461" r="6" fill="#D99A00"/><circle cx="1197" cy="715" r="6" fill="#1B2A4A"/>
